{% extends "base.html" %}
{% block title %}Cadastrar livro — Livraria do HH{% endblock %}
{% block content %}

  <h1>Cadastrar novo livro</h1>

  <form method="post" action="{{ url_for('cadastro_livro') }}" class="caixa-formulario">

    <div class="campo">
      <label for="titulo">Título *</label>
      <input type="text" id="titulo" name="titulo" required>
    </div>

    <div class="campo">
      <label for="autor">Autor</label>
      <input type="text" id="autor" name="autor">
    </div>

    <div class="campo">
      <label for="genero">Gênero *</label>
      <input type="text" id="genero" name="genero" required>
    </div>

    <div class="campo">
      <label for="ano_publicacao">Ano de publicação</label>
      <input type="text" id="ano_publicacao" name="ano_publicacao" placeholder="ex: 1997">
    </div>

    <div class="campo">
      <label for="preco">Preço (R$) *</label>
      <input type="number" id="preco" name="preco" step="0.01" min="0" required>
    </div>

    <button type="submit" class="botao">Cadastrar livro</button>

  </form>

{% endblock %}
